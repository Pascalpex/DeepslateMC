name: Build DeepslateMC
on: [ push, pull_request ]
jobs:
  build:
    runs-on: blacksmith-8vcpu-ubuntu-2404
    steps:
    - uses: actions/checkout@v6.0.3
      with:
        fetch-depth: 0
    - name: Set up JDK 25
      uses: actions/setup-java@v5.2.0
      with:
        java-version: 25.0.3
        distribution: 'temurin'
        cache: gradle
    - name: Configure Git
      run: |
          git config --global user.email "actions@github.com"
          git config --global user.name "Github Actions"
          git config --global gc.auto 0
          git config --global maintenance.auto false
    - name: Grant execute permission for gradlew
      run: chmod +x gradlew
    - name: Apply patches
      run: ./gradlew applyAllPatches --no-daemon
    - name: Generate Paperclip Jar
      run: ./gradlew createPaperclipJar --no-daemon
    - name: Upload Paperclip
      uses: actions/upload-artifact@v7.0.1
      with:
        name: DeepslateMC
        path: deepslateMC-server/build/libs/deepslateMC-paperclip-26.1.2.jar
        archive: false
